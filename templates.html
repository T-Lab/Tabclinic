<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Quality Report Viewer</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.65);
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --orange: #ea580c;
      --orange-soft: #ffedd5;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 30%),
        radial-gradient(circle at top right, #ede9fe 0%, transparent 28%),
        var(--bg);
      overflow: hidden;
    }

    body {
      padding: 18px;
    }

    .app {
      max-width: 1500px;
      height: calc(100vh - 36px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero {
      flex: 0 0 auto;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 6px auto 0;
      color: var(--muted);
      font-size: 14px;
    }

    .upload-card,
    .section {
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .upload-card {
      flex: 0 0 auto;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .upload-left h2 {
      margin: 0 0 4px;
      font-size: 18px;
    }

    .upload-left p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .file-input-wrap {
      padding: 10px 14px;
      border: 1px dashed #93c5fd;
      background: #f8fbff;
      border-radius: 14px;
      white-space: nowrap;
    }

    input[type="file"] {
      font-size: 13px;
      color: var(--muted);
    }

    #report {
      display: none;
      flex: 1 1 auto;
      min-height: 0;
      gap: 16px;
      grid-template-rows: auto 1fr 1.2fr;
    }

    .dashboard-row {
      display: grid;
      gap: 16px;
      min-height: 0;
    }

    .summary-row {
      grid-template-columns: repeat(5, 1fr);
    }

    .middle-row {
      grid-template-columns: 1fr 1fr 1fr;
      flex: 1;
    }

    .bottom-row {
      grid-template-columns: 2fr 1fr;
      flex: 1.2;
    }

    .section {
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .subtext {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      flex: 0 0 auto;
    }

    .metric-card {
      background: linear-gradient(180deg, #ffffff, #f8fbff);
      border: 1px solid #e8eef8;
      border-radius: 16px;
      padding: 16px;
      min-width: 0;
    }

    .metric-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eef2f7;
    }

    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: #334155;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      z-index: 1;
    }

    tr:hover td {
      background: #fafcff;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .good {
      color: var(--green);
      background: var(--green-soft);
    }

    .risky {
      color: var(--orange);
      background: var(--orange-soft);
    }

    .failed {
      color: var(--red);
      background: var(--red-soft);
    }

    .fairness-box {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: #374151;
      font-size: 14px;
      line-height: 1.6;
    }

    .recommendations {
      margin: 0;
      padding-left: 18px;
      overflow: auto;
      font-size: 14px;
    }

    .recommendations li {
      margin: 10px 0;
      color: #374151;
    }

    @media (max-width: 1200px) {
      html, body {
        overflow: auto;
      }

      .app {
        height: auto;
      }

      #report {
        display: block;
      }

      .dashboard-row {
        display: grid;
        grid-template-columns: 1fr !important;
        margin-bottom: 16px;
      }

      .summary-row {
        grid-template-columns: repeat(2, 1fr) !important;
      }

      .upload-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 700px) {
      .summary-row {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <h1>Data Quality Assessment Report</h1>
      <p>Modern horizontal dashboard for completeness, consistency, fairness, and column-level quality analysis.</p>
    </div>

    <div class="upload-card">
      <div class="upload-left">
        <h2>Upload report.json</h2>
        <p>Select your report file to render the dashboard.</p>
      </div>
      <div class="file-input-wrap">
        <input type="file" id="fileInput" accept=".json" />
      </div>
    </div>

    <div id="report">
      <!-- Row 1: Summary -->
      <div id="summary" class="dashboard-row summary-row"></div>

      <!-- Row 2: Middle -->
      <div class="dashboard-row middle-row">
        <div class="section">
          <h2>Completeness</h2>
          <p id="missing_rate" class="subtext"></p>
          <div class="table-wrap">
            <table id="missing_table"></table>
          </div>
        </div>

        <div class="section">
          <h2>Consistency / Anomaly</h2>
          <p id="anomaly_ratio" class="subtext"></p>
          <div class="table-wrap">
            <table id="anomaly_table"></table>
          </div>
        </div>

        <div class="section">
          <h2>Fairness</h2>
          <div id="fairness_text" class="fairness-box"></div>
        </div>
      </div>

      <!-- Row 3: Bottom -->
      <div class="dashboard-row bottom-row">
        <div class="section">
          <h2>Column-level Analysis</h2>
          <div class="table-wrap">
            <table id="column_table"></table>
          </div>
        </div>

        <div class="section">
          <h2>Recommendations</h2>
          <ul id="recommendations_list" class="recommendations"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("fileInput").addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = JSON.parse(e.target.result);
          renderReport(data);
        } catch (err) {
          alert("Invalid JSON file.");
        }
      };
      reader.readAsText(file);
    });

    function metricCard(label, value) {
      return `
        <div class="metric-card">
          <div class="metric-label">${label}</div>
          <div class="metric-value">${value}</div>
        </div>
      `;
    }

    function renderReport(data) {
      document.getElementById("report").style.display = "grid";

      const s = data.summary || {};
      document.getElementById("summary").innerHTML = `
        ${metricCard("Accuracy", Number(s.accuracy || 0).toFixed(4))}
        ${metricCard("Precision", Number(s.precision || 0).toFixed(4))}
        ${metricCard("Recall", Number(s.recall || 0).toFixed(4))}
        ${metricCard("F1 Score", Number(s.f1 || 0).toFixed(4))}
        ${metricCard("Error Rate", Number(s.error_rate || 0).toFixed(4))}
      `;

      document.getElementById("missing_rate").innerText =
        `Missing Rate: ${Number(data.completeness?.missing_rate || 0).toFixed(4)}`;

      let missingTable = `
        <tr>
          <th>Column</th>
          <th>Missing Count</th>
        </tr>
      `;
      for (const [col, cnt] of Object.entries(data.completeness?.missing_by_column || {})) {
        missingTable += `
          <tr>
            <td>${col}</td>
            <td>${cnt}</td>
          </tr>
        `;
      }
      document.getElementById("missing_table").innerHTML = missingTable;

      document.getElementById("anomaly_ratio").innerText =
        `Anomaly Ratio: ${Number(data.consistency?.anomaly_ratio || 0).toFixed(4)}`;

      let anomalyTable = `
        <tr>
          <th>Column</th>
          <th>Anomaly Count</th>
        </tr>
      `;
      for (const [col, cnt] of Object.entries(data.consistency?.anomaly_by_column || {})) {
        anomalyTable += `
          <tr>
            <td>${col}</td>
            <td>${cnt}</td>
          </tr>
        `;
      }
      document.getElementById("anomaly_table").innerHTML = anomalyTable;

      document.getElementById("fairness_text").innerText =
        data.fairness?.interpretation || "No fairness interpretation provided.";

      let colTable = `
        <tr>
          <th>Column</th>
          <th>Status</th>
          <th>F1</th>
          <th>Recall</th>
          <th>Precision</th>
        </tr>
      `;

      for (const c of data.column_analysis || []) {
        const statusClass = c.status || "risky";
        colTable += `
          <tr>
            <td>${c.column}</td>
            <td><span class="status-badge ${statusClass}">${statusClass}</span></td>
            <td>${Number(c.f1 || 0).toFixed(4)}</td>
            <td>${Number(c.recall || 0).toFixed(4)}</td>
            <td>${Number(c.precision || 0).toFixed(4)}</td>
          </tr>
        `;
      }
      document.getElementById("column_table").innerHTML = colTable;

      const recList = document.getElementById("recommendations_list");
      recList.innerHTML = "";
      for (const r of data.recommendations || []) {
        const li = document.createElement("li");
        li.innerText = r;
        recList.appendChild(li);
      }
    }
  </script>
</body>
</html>
